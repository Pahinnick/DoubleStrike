<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DoubleStrike</title>
    <!--
      Locked down to exactly what this app talks to: Scryfall (card data + card art),
      EDHREC (salt scores), and PeerJS's public broker + Google/PeerJS STUN/TURN (multiplayer
      WebRTC signaling) — see src/api/scryfall.ts, src/api/edhrec.ts, and
      node_modules/peerjs's CLOUD_HOST/iceServers defaults for where these came from.
      Scryfall spans three hosts, and they are NOT interchangeable between directives:
      api.scryfall.com (JSON API) and data.scryfall.io (bulk files, used by the Oracle Tags
      index in src/storage/tagIndex.ts) both need connect-src, while cards.scryfall.io serves
      card art via <img> and so only needs img-src.
      style-src needs 'unsafe-inline' because this app sets React inline styles (card-size
      CSS vars, popover positioning) extensively — refactoring that away wasn't worth the
      much-lower-risk tradeoff (inline styles can't execute script on their own).
      stun:/turn: are listed as bare schemes, NOT host-qualified (e.g. NOT
      "stun:stun.l.google.com:19302") — STUN/TURN URIs have no "//" after the scheme (RFC
      7064/7065), which doesn't fit CSP's host-source grammar, so a host-qualified entry is
      silently rejected as invalid and dropped from the allow-list (visible as a "contains an
      invalid source" console warning). That left ICE gathering unable to reach ANY STUN/TURN
      server, forcing WebRTC down to local/host candidates only — connections a guest happened
      to establish via other paths (e.g. a same-LAN host candidate) would work initially but
      had no STUN/TURN fallback to recover through, so any mid-session ICE hiccup (far more
      likely with 3-4 simultaneous host<->guest links than with just 1 in a 2-player game)
      dropped that connection for good instead of renegotiating.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' https://cards.scryfall.io data:;
        media-src 'self' https://ice6.somafm.com;
        connect-src 'self' https://api.scryfall.com https://data.scryfall.io https://json.edhrec.com https://0.peerjs.com wss://0.peerjs.com stun: turn:;
        font-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';"
    />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
